<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Boy Poster — Админка</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page page--admin">
    <main class="admin-panel">
      <h1>Админка экрана Game Boy</h1>
      <p>Загрузите картинку — она сразу отобразится на главной странице в экране консоли.</p>

      <form id="upload-form" class="admin-form">
        <label class="file-input">
          <input id="image-input" type="file" accept="image/*" required />
          <span>Выбрать картинку</span>
        </label>

        <button class="btn" type="submit">Сохранить на экран</button>
        <button class="btn btn--ghost" type="button" id="clear-image">Очистить экран</button>
      </form>

      <p id="admin-status" class="admin-status" aria-live="polite"></p>

      <section class="preview-box">
        <h2>Предпросмотр</h2>
        <img id="preview-image" alt="Предпросмотр выбранного изображения" hidden />
        <p id="preview-placeholder">Пока изображение не выбрано</p>
      </section>

      <a class="admin-link" href="/index.html">← Вернуться на главную</a>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
