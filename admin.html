<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка — Курица на заказ</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="site site--admin">
    <main class="admin">
      <header class="page-head">
        <h1>Админка портфолио</h1>
        <a class="link" href="/index.html">← На главную</a>
      </header>

      <form id="admin-form" class="admin-form">
        <input id="dish-title" type="text" placeholder="Блюдо" required />
        <input id="dish-benefit" type="text" placeholder="Преимущество" required />
        <input id="dish-time" type="text" placeholder="Сколько готовлю (например 45 минут)" required />
        <input id="dish-price" type="text" placeholder="Цена" required />
        <label class="file-input">
          <input id="dish-image" type="file" accept="image/*" required />
          <span>Загрузить фото блюда</span>
        </label>
        <button class="btn btn--accent" type="submit">Добавить в портфолио</button>
      </form>

      <p id="admin-status" class="status"></p>

      <section>
        <h2>Текущие карточки</h2>
        <div id="admin-items" class="admin-items"></div>
      </section>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
