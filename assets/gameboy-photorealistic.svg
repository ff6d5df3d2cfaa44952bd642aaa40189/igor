<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-label="Photorealistic Game Boy">
  <defs>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#efe1c8"/>
      <stop offset="0.55" stop-color="#d8c6a3"/>
      <stop offset="1" stop-color="#b79e79"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.24" cy="0.12" r="0.72">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenShell" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#43454f"/>
      <stop offset="1" stop-color="#1e2026"/>
    </linearGradient>
    <linearGradient id="screenGlass" x1="0" x2="0.9" y1="0" y2="1">
      <stop offset="0" stop-color="#8e9f3e"/>
      <stop offset="1" stop-color="#748631"/>
    </linearGradient>
    <radialGradient id="button" cx="0.32" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#db2d72"/>
      <stop offset="1" stop-color="#8d1744"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="95" y="80" width="710" height="1200" rx="85" fill="url(#body)" stroke="#6c5a40" stroke-width="7" filter="url(#shadow)"/>
  <rect x="95" y="80" width="710" height="1200" rx="85" fill="url(#shine)"/>

  <g transform="translate(160 200)">
    <rect x="0" y="0" width="580" height="480" rx="34" fill="url(#screenShell)" stroke="#111" stroke-width="4"/>
    <circle cx="45" cy="235" r="10" fill="#bf1036"/>
    <text x="24" y="265" font-size="26" fill="#f0f0f0" font-family="Arial">BATTERY</text>
    <rect x="95" y="55" width="430" height="360" rx="18" fill="url(#screenGlass)" stroke="#1f2412" stroke-width="5"/>
    <rect x="95" y="55" width="430" height="360" rx="18" fill="white" opacity="0.12"/>
  </g>

  <text x="160" y="730" font-size="58" font-family="Arial" fill="#1f2132" font-weight="700">Nintendo <tspan font-style="italic">GAME BOY</tspan></text>

  <g transform="translate(165 825)">
    <rect x="0" y="45" width="145" height="50" rx="10" fill="#1a1b1e"/>
    <rect x="48" y="0" width="50" height="145" rx="10" fill="#1a1b1e"/>
    <circle cx="73" cy="70" r="16" fill="#292c31"/>
  </g>

  <g transform="translate(520 875) rotate(-18)">
    <circle cx="0" cy="0" r="48" fill="url(#button)" stroke="#4b0b25" stroke-width="4"/>
    <circle cx="130" cy="0" r="48" fill="url(#button)" stroke="#4b0b25" stroke-width="4"/>
  </g>

  <g transform="translate(320 1030) rotate(-16)">
    <rect x="0" y="0" width="78" height="24" rx="12" fill="#53535d"/>
    <rect x="140" y="0" width="78" height="24" rx="12" fill="#53535d"/>
    <text x="4" y="56" font-size="28" fill="#282828" font-family="Arial" font-weight="700">SELECT</text>
    <text x="152" y="56" font-size="28" fill="#282828" font-family="Arial" font-weight="700">START</text>
  </g>

  <g transform="translate(570 1050) rotate(23)">
    <rect x="0" y="0" width="12" height="120" rx="8" fill="#2c2d30"/>
    <rect x="30" y="0" width="12" height="120" rx="8" fill="#2c2d30"/>
    <rect x="60" y="0" width="12" height="120" rx="8" fill="#2c2d30"/>
    <rect x="90" y="0" width="12" height="120" rx="8" fill="#2c2d30"/>
    <rect x="120" y="0" width="12" height="120" rx="8" fill="#2c2d30"/>
  </g>
</svg>
