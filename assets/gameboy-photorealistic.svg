<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-label="Man holding Game Boy, photorealistic style">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2533"/>
      <stop offset="1" stop-color="#0f1218"/>
    </linearGradient>

    <radialGradient id="spot" cx="0.32" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#47526b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0f1218" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>

    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c7a3"/>
      <stop offset="0.5" stop-color="#d39c75"/>
      <stop offset="1" stop-color="#9e6a47"/>
    </linearGradient>

    <linearGradient id="skinShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cc926c"/>
      <stop offset="1" stop-color="#7c4f35"/>
    </linearGradient>

    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2c8"/>
      <stop offset="0.45" stop-color="#dbc8a6"/>
      <stop offset="1" stop-color="#b89e77"/>
    </linearGradient>

    <radialGradient id="bodyShine" cx="0.2" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#474b55"/>
      <stop offset="1" stop-color="#1c1f27"/>
    </linearGradient>

    <linearGradient id="lcd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bad45"/>
      <stop offset="1" stop-color="#6f8130"/>
    </linearGradient>

    <radialGradient id="btn" cx="0.35" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#dc2c70"/>
      <stop offset="1" stop-color="#8b153f"/>
    </radialGradient>

    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect width="1200" height="1600" fill="url(#spot)"/>

  <g opacity="0.9">
    <path d="M160 1110c-22-99 72-194 168-174 44 9 71 37 95 62l48 50-77 80-95-39-12 137c-4 52-52 86-101 71-16-5-31-14-43-26-9-22 5-38 20-56 17-20 22-39-3-55z" fill="url(#skinShadow)"/>
    <path d="M307 961c65-73 146-80 216-37 44 26 71 72 85 122l-52 63-95-36-85 58-105-39-4-131z" fill="url(#skin)"/>
    <path d="M744 905c97-95 241-98 300 3 29 48 28 126-12 175l-90 111-87-66 40-91-153-17-28-91 30-24z" fill="url(#skin)"/>
    <path d="M832 1019c50-54 153-56 190-8 17 22 16 61-5 91l-66 79-67-52 27-64-79-14z" fill="url(#skinShadow)" opacity="0.8"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="290" y="310" width="620" height="990" rx="78" fill="url(#body)" stroke="#6f5c41" stroke-width="7"/>
    <rect x="290" y="310" width="620" height="990" rx="78" fill="url(#bodyShine)"/>

    <rect x="340" y="430" width="520" height="450" rx="34" fill="url(#shell)"/>
    <circle cx="386" cy="644" r="11" fill="#c4153a"/>
    <text x="358" y="679" font-size="24" fill="#f4f4f4" font-family="Arial">BATTERY</text>

    <rect x="445" y="486" width="360" height="305" rx="18" fill="url(#lcd)" stroke="#21260f" stroke-width="6"/>
    <rect x="445" y="486" width="360" height="305" rx="18" fill="#fff" opacity="0.16"/>

    <text x="355" y="935" font-size="54" fill="#212337" font-family="Arial" font-weight="700">Nintendo <tspan font-style="italic">GAME BOY</tspan></text>

    <g transform="translate(360 1045)">
      <rect x="0" y="40" width="144" height="52" rx="10" fill="#1a1b1f"/>
      <rect x="46" y="0" width="52" height="132" rx="10" fill="#1a1b1f"/>
      <circle cx="72" cy="66" r="14" fill="#2d3037"/>
    </g>

    <g transform="translate(700 1085) rotate(-18)">
      <circle cx="0" cy="0" r="45" fill="url(#btn)" stroke="#4d0922" stroke-width="4"/>
      <circle cx="120" cy="0" r="45" fill="url(#btn)" stroke="#4d0922" stroke-width="4"/>
    </g>

    <g transform="translate(520 1210) rotate(-16)">
      <rect x="0" y="0" width="72" height="22" rx="11" fill="#575964"/>
      <rect x="126" y="0" width="72" height="22" rx="11" fill="#575964"/>
      <text x="0" y="48" font-size="22" fill="#282b32" font-family="Arial" font-weight="700">SELECT</text>
      <text x="132" y="48" font-size="22" fill="#282b32" font-family="Arial" font-weight="700">START</text>
    </g>

    <g transform="translate(720 1210) rotate(24)">
      <rect x="0" y="0" width="11" height="108" rx="7" fill="#2c2e35"/>
      <rect x="26" y="0" width="11" height="108" rx="7" fill="#2c2e35"/>
      <rect x="52" y="0" width="11" height="108" rx="7" fill="#2c2e35"/>
      <rect x="78" y="0" width="11" height="108" rx="7" fill="#2c2e35"/>
      <rect x="104" y="0" width="11" height="108" rx="7" fill="#2c2e35"/>
    </g>
  </g>

  <rect width="1200" height="1600" filter="url(#grain)" opacity="0.7"/>
</svg>
