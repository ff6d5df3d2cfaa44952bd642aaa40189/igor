<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Boy Poster — Главная</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page page--poster">
    <main class="poster-layout">
      <header class="poster-title">ゲームボーイ</header>

      <section class="poster-content" aria-label="Ретро постер с Game Boy">
        <p class="side-copy side-copy--left">激情に注意</p>

        <article class="gameboy" aria-label="Game Boy с меняемым экраном">
          <div class="gameboy__top"></div>

          <section class="gameboy__screen-wrap">
            <div class="gameboy__led" aria-hidden="true"></div>
            <div class="gameboy__screen" id="gameboy-screen" role="img" aria-label="Изображение на экране Game Boy">
              <img id="screen-image" alt="Загруженное изображение" hidden />
              <p id="screen-placeholder">Загрузите картинку через админку</p>
            </div>
          </section>

          <h1 class="gameboy__brand">Nintendo <span>GAME BOY</span></h1>

          <div class="gameboy__controls" aria-hidden="true">
            <div class="dpad"></div>
            <div class="ab-buttons">
              <span>A</span>
              <span>B</span>
            </div>
          </div>
        </article>

        <p class="side-copy side-copy--right">好滴に味おい</p>
      </section>

      <footer class="poster-footer">
        <div class="rainbow"></div>
        <div class="poster-text">
          <strong>GAME BOY CLUB</strong>
          <span>Portable Fun</span>
        </div>
      </footer>

      <a class="admin-link" href="/admin.html">Открыть админку</a>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
