<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог чатов жилых комплексов</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --surface: #ffffff;
        --text: #1a202c;
        --muted: #4a5568;
        --primary: #2b6cb0;
        --primary-soft: #ebf4ff;
        --border: #e2e8f0;
        --shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      .container {
        width: min(1100px, 92vw);
        margin: 0 auto;
      }

      .hero {
        background: linear-gradient(135deg, #2b6cb0, #1a365d);
        color: #fff;
        padding: 56px 0 42px;
        box-shadow: var(--shadow);
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3.2vw, 2.6rem);
      }

      .hero p {
        margin-top: 12px;
        max-width: 720px;
        color: rgba(255, 255, 255, 0.9);
      }

      .controls {
        margin-top: -18px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        box-shadow: var(--shadow);
      }

      .controls__item {
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      input,
      select {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        color: var(--text);
        background: #fff;
      }

      .results-meta {
        margin: 18px 0 12px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .catalog {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        padding-bottom: 36px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card__top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }

      .card h2 {
        margin: 0;
        font-size: 1.05rem;
      }

      .badge {
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.78rem;
        color: var(--primary);
        background: var(--primary-soft);
        white-space: nowrap;
      }

      .card__facts {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .card__chat-link {
        margin-top: auto;
        text-align: center;
        text-decoration: none;
        color: #fff;
        background: var(--primary);
        border-radius: 10px;
        padding: 9px;
        font-weight: 500;
      }

      .empty {
        padding: 20px;
        text-align: center;
        border: 1px dashed var(--border);
        border-radius: 12px;
        color: var(--muted);
        background: #fff;
        grid-column: 1 / -1;
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="hero__content container">
        <h1>Каталог чатов жилых комплексов</h1>
        <p>
          Быстрый поиск соседских чатов по району, классу жилья и стадии сдачи.
          Выберите ЖК и присоединяйтесь к обсуждениям.
        </p>
      </div>
    </header>

    <main class="container">
      <section class="controls" aria-label="Фильтры каталога">
        <label class="controls__item">
          <span>Поиск по названию</span>
          <input id="searchInput" type="search" placeholder="Например, Солнечный берег" />
        </label>

        <label class="controls__item">
          <span>Район</span>
          <select id="districtFilter">
            <option value="">Все районы</option>
          </select>
        </label>

        <label class="controls__item">
          <span>Класс</span>
          <select id="classFilter">
            <option value="">Любой класс</option>
          </select>
        </label>

        <label class="controls__item">
          <span>Стадия</span>
          <select id="statusFilter">
            <option value="">Любая стадия</option>
          </select>
        </label>
      </section>

      <section>
        <div class="results-meta" id="resultsMeta">Найдено: 0</div>
        <div id="catalog" class="catalog" aria-live="polite"></div>
      </section>
    </main>

    <template id="cardTemplate">
      <article class="card">
        <div class="card__top">
          <h2></h2>
          <span class="badge"></span>
        </div>
        <ul class="card__facts"></ul>
        <a class="card__chat-link" target="_blank" rel="noopener noreferrer">Открыть чат</a>
      </article>
    </template>

    <script>
      const complexes = [
        {
          name: 'ЖК Солнечный Берег',
          district: 'Приморский',
          classType: 'Комфорт',
          status: 'Сдан',
          apartments: '1 420 квартир',
          chatUrl: 'https://t.me/example_sunny_coast'
        },
        {
          name: 'ЖК Северный Парк',
          district: 'Северный',
          classType: 'Бизнес',
          status: 'Строится',
          apartments: '980 квартир',
          chatUrl: 'https://t.me/example_north_park'
        },
        {
          name: 'ЖК Лесная Резиденция',
          district: 'Западный',
          classType: 'Премиум',
          status: 'Сдан',
          apartments: '640 квартир',
          chatUrl: 'https://t.me/example_forest_residence'
        },
        {
          name: 'ЖК Речной Квартал',
          district: 'Центральный',
          classType: 'Комфорт',
          status: 'Ключи в 2026',
          apartments: '1 150 квартир',
          chatUrl: 'https://t.me/example_river_quarter'
        },
        {
          name: 'ЖК Маяк City',
          district: 'Южный',
          classType: 'Бизнес',
          status: 'Строится',
          apartments: '770 квартир',
          chatUrl: 'https://t.me/example_mayak_city'
        },
        {
          name: 'ЖК Зеленые Террасы',
          district: 'Восточный',
          classType: 'Комфорт',
          status: 'Ключи в 2027',
          apartments: '1 890 квартир',
          chatUrl: 'https://t.me/example_green_terraces'
        }
      ];

      const searchInput = document.getElementById('searchInput');
      const districtFilter = document.getElementById('districtFilter');
      const classFilter = document.getElementById('classFilter');
      const statusFilter = document.getElementById('statusFilter');
      const catalog = document.getElementById('catalog');
      const resultsMeta = document.getElementById('resultsMeta');
      const cardTemplate = document.getElementById('cardTemplate');

      const uniqueValues = (key) => [...new Set(complexes.map((item) => item[key]))].sort();

      const fillSelect = (select, values) => {
        values.forEach((value) => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = value;
          select.append(option);
        });
      };

      fillSelect(districtFilter, uniqueValues('district'));
      fillSelect(classFilter, uniqueValues('classType'));
      fillSelect(statusFilter, uniqueValues('status'));

      const matchesFilters = (item) => {
        const query = searchInput.value.trim().toLowerCase();

        const byName = !query || item.name.toLowerCase().includes(query);
        const byDistrict = !districtFilter.value || item.district === districtFilter.value;
        const byClass = !classFilter.value || item.classType === classFilter.value;
        const byStatus = !statusFilter.value || item.status === statusFilter.value;

        return byName && byDistrict && byClass && byStatus;
      };

      const createCard = (item) => {
        const node = cardTemplate.content.firstElementChild.cloneNode(true);

        node.querySelector('h2').textContent = item.name;
        node.querySelector('.badge').textContent = item.classType;

        const facts = node.querySelector('.card__facts');
        [`Район: ${item.district}`, `Статус: ${item.status}`, `Объём: ${item.apartments}`].forEach(
          (text) => {
            const li = document.createElement('li');
            li.textContent = text;
            facts.append(li);
          }
        );

        const link = node.querySelector('.card__chat-link');
        link.href = item.chatUrl;
        link.setAttribute('aria-label', `Открыть чат ${item.name}`);

        return node;
      };

      const render = () => {
        const filtered = complexes.filter(matchesFilters);
        catalog.replaceChildren();
        resultsMeta.textContent = `Найдено: ${filtered.length}`;

        if (!filtered.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'По вашему запросу ничего не найдено. Попробуйте изменить фильтры.';
          catalog.append(empty);
          return;
        }

        filtered.forEach((item) => {
          catalog.append(createCard(item));
        });
      };

      [searchInput, districtFilter, classFilter, statusFilter].forEach((input) => {
        input.addEventListener('input', render);
        input.addEventListener('change', render);
      });

      render();
    </script>
  </body>
</html>
