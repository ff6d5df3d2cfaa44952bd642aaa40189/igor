<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR BAND — 2026</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="poster" id="poster">
      <header class="top-copy">
        <h1>PR BAND</h1>
        <p class="line-a">ПОМОЖЕМ АРТИСТУ ПРОЯВИТЬСЯ В ПОЛНОЙ МЕРЕ</p>
        <p class="line-b">БРЕНД-МЕНЕДЖМЕНТ<br />SMM И МАРКЕТИНГ<br />МЕНЕДЖМЕНТ АРТИСТА</p>
      </header>

      <section class="arena" aria-label="Игровая сцена продвижения">
        <div class="skyline">
          <div class="tower" aria-label="Останкинская башня"></div>
        </div>

        <div class="pacman" id="pacman" aria-label="Пакмен"></div>
        <div class="ghost ghost--c" id="ghost-c"></div>
        <div class="ghost ghost--o" id="ghost-o"></div>
        <div class="ghost ghost--r" id="ghost-r"></div>

        <div class="kong" id="kong" aria-label="Кинг-Конг">
          <div class="kong__face"></div>
        </div>

        <div class="barrel barrel--1"></div>
        <div class="barrel barrel--2"></div>
        <div class="barrel barrel--3"></div>
      </section>

      <div class="cta-bubble">ЗАПУСТИТЬ ПРОДВИЖЕНИЕ</div>

      <section class="controls">
        <button id="auto-btn" class="ctrl">АВТО-КНОПКА</button>
        <button id="arcade-btn" class="ctrl">КНОПКА START</button>
        <button id="lever" class="lever" aria-label="Рычажок запуска">
          <span class="lever__stick"></span>
          <span class="lever__base"></span>
        </button>
      </section>

      <footer class="year">2026</footer>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
